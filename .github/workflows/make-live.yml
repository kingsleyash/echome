name: Promote to Live

on:
  workflow_dispatch:

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout test site
        uses: actions/checkout@v4

      - name: Push to live repository
        env:
          TOKEN: ${{ secrets.LIVE_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${TOKEN}@github.com/kingsleyash/echome-live.git live

          rsync -av --delete \
            --exclude='.git' \
            ./ live/

          cd live

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "Promote test version to live" || echo "No changes to commit"
          git push origin main
